<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>원주율 탐구 · 앞 화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
html,body{height:100%}
body.board{overflow:hidden}
.wrap{height:100vh;padding:2.8vh 2.3vw;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.9vh;gap:20px}
.ttl{display:flex;align-items:center;gap:16px;min-width:0}
.ttl svg{width:clamp(56px,7.8vh,84px);height:auto;flex:none}
h1{font-family:Jua,sans-serif;font-weight:400;font-size:clamp(30px,4.8vh,52px);margin:0;letter-spacing:-.5px;display:flex;align-items:center;gap:14px;white-space:nowrap}
h1 .badge{font-size:.6em;padding:.2em .7em}
.right{display:flex;align-items:center;gap:12px}
.live{font-family:Jua,sans-serif;font-size:clamp(16px,2.2vh,24px);color:var(--sub);background:#fff;border:2px solid var(--line);border-radius:99px;padding:.35em 1em;white-space:nowrap}
.live b{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--mint);margin-right:.45em;box-shadow:0 0 0 .22em #d3f2ea;vertical-align:.05em}
.live.off b{background:var(--red);box-shadow:0 0 0 .22em #fbe0dd}
.right .chg{font-size:clamp(14px,1.8vh,20px);padding:.45em .9em}
.main{flex:1;display:grid;grid-template-columns:1.8fr 1fr;gap:1.4vw;min-height:0}
.card{background:#fff;border:2px solid var(--line);border-radius:28px;padding:2.2vh 1.5vw;display:flex;flex-direction:column;min-height:0}
.ct{font-family:Jua,sans-serif;font-size:clamp(22px,2.8vh,30px);margin:0 0 .3em;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tag{font-size:.72em;background:var(--cbg);color:var(--cdark);border-radius:99px;padding:.15em .75em}
.tag:empty{display:none}
.cap{font-size:clamp(15px,1.9vh,20px);color:var(--sub);margin:0}
svg.plot{flex:1;width:100%;min-height:0}
.scroll{flex:1;overflow-y:auto;min-height:0;margin-right:-8px;padding-right:8px}
table{width:100%;border-collapse:separate;border-spacing:0 .25em;font-size:clamp(18px,2.6vh,28px)}
thead th{position:sticky;top:0;background:#fff;z-index:1;font-family:Jua,sans-serif;font-weight:400;color:var(--sub);font-size:.72em;text-align:left;padding:.2em .45em .3em}
td{padding:.4em .45em;background:var(--soft);font-family:Jua,sans-serif}
td:first-child{border-radius:16px 0 0 16px;word-break:break-all}
td:last-child{border-radius:0 16px 16px 0}
.n{text-align:right}
.rv{background:var(--rbg);color:var(--r);padding:.05em .5em;border-radius:99px}
tr.new td{background:var(--cbg)}
.empty td{background:none;text-align:center;color:var(--sub);font-family:"Gowun Dodum",sans-serif;padding:2em 0;font-size:.8em}
</style>
</head>
<body>

<div class="picker hidden" id="pickView">
  <svg width="90" height="90" viewBox="0 0 74 74" aria-hidden="true"><circle cx="37" cy="37" r="31" fill="#fff" stroke="#f08a3c" stroke-width="5"/><line x1="8" y1="37" x2="66" y2="37" stroke="#3b82d6" stroke-width="4" stroke-linecap="round"/><circle cx="27" cy="27" r="3.5" fill="#2d2a26"/><circle cx="47" cy="27" r="3.5" fill="#2d2a26"/><path d="M29 46 q8 7 16 0" stroke="#2d2a26" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="20" cy="44" r="4" fill="#ffc6b0"/><circle cx="54" cy="44" r="4" fill="#ffc6b0"/></svg>
  <h1 style="justify-content:center">어느 반 기록을 띄울까요?</h1>
  <p>고른 반의 기록이 앞 화면에 실시간으로 나와요.</p>
  <div class="pgrid" id="pgrid"></div>
</div>

<div class="wrap hidden" id="mainView">
  <div class="top">
    <div class="ttl">
      <svg viewBox="0 0 74 74" aria-hidden="true"><circle cx="37" cy="37" r="31" fill="#fff" stroke="#f08a3c" stroke-width="5"/><line x1="8" y1="37" x2="66" y2="37" stroke="#3b82d6" stroke-width="4" stroke-linecap="round"/><circle cx="27" cy="27" r="3.5" fill="#2d2a26"/><circle cx="47" cy="27" r="3.5" fill="#2d2a26"/><path d="M29 46 q8 7 16 0" stroke="#2d2a26" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="20" cy="44" r="4" fill="#ffc6b0"/><circle cx="54" cy="44" r="4" fill="#ffc6b0"/></svg>
      <h1><span class="badge" id="badge"></span>원주 ÷ 지름, 우리 반은 얼마나 나왔을까?</h1>
    </div>
    <div class="right">
      <span class="live" id="live"><b></b><span id="liveText">불러오는 중…</span></span>
      <button class="chg" id="chg">반 바꾸기</button>
    </div>
  </div>
  <div class="main">
    <div class="card">
      <p class="ct">값 모아 보기 <span class="tag" id="newest"></span></p>
      <p class="cap">같은 값이 나오면 동그라미가 위로 쌓여요.</p>
      <svg class="plot" id="g" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="card">
      <p class="ct">최근 기록</p>
      <div class="scroll">
        <table>
          <thead><tr><th>물건</th><th class="n">지름</th><th class="n">원주</th><th class="n">원주÷지름</th></tr></thead>
          <tbody id="tb"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const KEY = 'pi_board_ban';
const store = {
  get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
  set(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (e) {} }
};
const LO = 300, HI = 330;
let ban = null, rows = [], lastSig = null;

$('pgrid').innerHTML = [1, 2, 3, 4, 5].map(n =>
  `<button class="pbtn" data-ban="${n}"><span class="g">6학년</span><span class="n">${n}반</span></button>`).join('');
$('pgrid').addEventListener('click', e => { const b = e.target.closest('.pbtn'); if (b) enter(b.dataset.ban); });
$('chg').onclick = () => { store.set(null); ban = null; show(); };

function show() {
  $('pickView').classList.toggle('hidden', !!ban);
  $('mainView').classList.toggle('hidden', !ban);
  document.body.classList.toggle('board', !!ban);
}

function enter(b) {
  ban = String(b); store.set(ban); rows = []; lastSig = null;
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  $('badge').textContent = '6학년 ' + ban + '반';
  document.title = '원주율 탐구 · 6학년 ' + ban + '반';
  setLive(true, '불러오는 중…');
  render(); show(); refresh();
}

function drawTable(list, latestId) {
  $('tb').innerHTML = list.length ? list.map(r =>
    `<tr${r.id === latestId ? ' class="new"' : ''}><td>${esc(r.name)}</td><td class="n">${r.d}</td><td class="n">${r.c}</td><td class="n"><span class="rv">${r.r}</span></td></tr>`
  ).join('') : '<tr class="empty"><td colspan="4">학생들의 기록을 기다리고 있어요.</td></tr>';
}

function drawPlot(list, latestId) {
  const L = 170, R = 830, base = 470, topY = 20;
  const X = k => L + (k - LO) / (HI - LO) * (R - L);
  const LX = 62, RX = 938;
  const bins = {};
  list.slice().sort((a, b) => a.t - b.t).forEach(r => {
    const k = Math.round(r.r * 100);
    const key = k < LO ? 'L' : k > HI ? 'R' : String(k);
    (bins[key] = bins[key] || []).push(r);
  });
  const maxStack = Math.max(1, ...Object.values(bins).map(b => b.length));
  const step = Math.min(23, (base - 14 - topY - 80) / maxStack);
  const rad = Math.max(3.5, Math.min(10, step * 0.45));
  let s = '';

  s += `<rect x="${L - 14}" y="${base - 6}" width="${R - L + 28}" height="12" rx="6" fill="#f3e7d2"/>`;
  for (let k = LO; k <= HI; k++) {
    const x = X(k);
    if (k % 10 === 0) {
      s += `<rect x="${x - 2.5}" y="${base - 6}" width="5" height="26" rx="2.5" fill="#b9ab93"/>`;
      s += `<text x="${x}" y="${base + 60}" font-family="Jua" font-size="34" fill="#2d2a26" text-anchor="middle">${(k / 100).toFixed(1)}</text>`;
    } else if (k % 5 === 0) {
      s += `<rect x="${x - 1.5}" y="${base + 6}" width="3" height="11" rx="1.5" fill="#d3c6af"/>`;
    } else {
      s += `<rect x="${x - 1}" y="${base + 6}" width="2" height="6" rx="1" fill="#e2d6c2"/>`;
    }
  }
  s += `<text x="${(L + R) / 2}" y="${base + 104}" font-family="Gowun Dodum" font-size="22" fill="#7a7368" text-anchor="middle">원주 ÷ 지름</text>`;

  [['L', LX, '3.0보다 작아요'], ['R', RX, '3.3보다 커요']].forEach(([k, x, t]) => {
    s += `<rect x="${x - 56}" y="${topY}" width="112" height="${base - topY + 6}" rx="18" fill="#faf6ef" stroke="#e2d8c6" stroke-width="2" stroke-dasharray="6 6"/>`;
    s += `<text x="${x}" y="${base + 40}" font-family="Jua" font-size="19" fill="#9b9283" text-anchor="middle">${t}</text>`;
    s += `<text x="${x}" y="${base + 66}" font-family="Gowun Dodum" font-size="17" fill="#9b9283" text-anchor="middle">다시 재 볼까요?</text>`;
  });

  Object.entries(bins).forEach(([key, items]) => {
    const out = key === 'L' || key === 'R';
    const x = key === 'L' ? LX : key === 'R' ? RX : X(Number(key));
    items.forEach((r, i) => {
      const y = base - 14 - step * i - rad;
      const isNew = r.id === latestId;
      const fill = isNew ? '#f08a3c' : out ? '#bdb5a6' : '#8b5cf6';
      if (isNew) s += `<circle cx="${x}" cy="${y}" r="${rad + 7}" fill="#f08a3c" fill-opacity=".22"/>`;
      s += `<circle cx="${x}" cy="${y}" r="${rad}" fill="${fill}"><title>${esc(r.name)}: ${r.r}</title></circle>`;
      s += `<circle cx="${x - rad * 0.35}" cy="${y - rad * 0.35}" r="${rad * 0.3}" fill="#fff" fill-opacity=".45"/>`;
    });
  });

  const inBins = Object.entries(bins).filter(([k]) => k !== 'L' && k !== 'R');
  const most = Math.max(0, ...inBins.map(([, v]) => v.length));
  if (most >= 2) {
    const tops = inBins.filter(([, v]) => v.length === most).map(([k]) => Number(k)).sort((a, b) => a - b);
    const label = tops.map(k => (k / 100).toFixed(2)).join(', ') + '에 가장 많이 모였어요';
    const w = Math.max(260, label.length * 18 + 50);
    let cx = tops.reduce((a, k) => a + X(k), 0) / tops.length;
    const ax = cx;
    cx = Math.min(Math.max(cx, L + w / 2 - 40), R - w / 2 + 40);
    const ty = base - 14 - step * most - 22;
    s += `<rect x="${cx - w / 2}" y="${ty - 56}" width="${w}" height="50" rx="25" fill="#2d2a26"/>`;
    s += `<path d="M${ax - 10} ${ty - 7} L${ax} ${ty + 7} L${ax + 10} ${ty - 7}z" fill="#2d2a26"/>`;
    s += `<text x="${cx}" y="${ty - 22}" font-family="Jua" font-size="24" fill="#fff" text-anchor="middle">${label}</text>`;
  }
  $('g').innerHTML = s;
}

function render() {
  const list = rows.slice().sort((a, b) => b.t - a.t);
  const latest = list[0];
  const latestId = latest ? latest.id : null;
  $('newest').textContent = latest ? '● 방금: ' + latest.name + ' ' + latest.r : '';
  drawTable(list, latestId);
  drawPlot(list, latestId);
}

function setLive(ok, text) {
  $('live').classList.toggle('off', !ok);
  $('liveText').textContent = text;
}

async function refresh() {
  if (!ban) return;
  if (!SCRIPT_URL) { setLive(false, 'config.js에 SCRIPT_URL을 넣어 주세요'); return; }
  const forBan = ban;
  try {
    const q = new URLSearchParams({ ban: forBan, _: Date.now() });
    const res = await fetch(SCRIPT_URL + '?' + q.toString());
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    if (forBan !== ban) return;
    rows = data.rows || [];
    const sig = rows.map(r => r.id).join();
    if (sig !== lastSig) { lastSig = sig; render(); }
    setLive(true, '기록 ' + rows.length + '개 · 실시간 반영 중');
  } catch (e) {
    if (forBan === ban) setLive(false, '연결이 끊겼어요 · 다시 시도하는 중');
  }
}

const fromUrl = new URLSearchParams(location.search).get('ban');
const saved = /^[1-5]$/.test(fromUrl || '') ? fromUrl : store.get();
if (saved && /^[1-5]$/.test(saved)) enter(saved); else show();
setInterval(refresh, 4000);
</script>
</body>
</html>
